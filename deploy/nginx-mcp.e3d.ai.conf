# nginx server blocks for the public remote MCP server (server-remote.js,
# PM2 app e3d-mcp-remote on 127.0.0.1:3011) at https://mcp.e3d.ai/mcp.
#
# NOT applied automatically. Convention on this host: server blocks live in
# /etc/nginx/sites-enabled/default (see the liquiditywatch.e3d.ai block);
# TLS is issued/managed by certbot:
#   1. add the DNS record for mcp.e3d.ai
#   2. paste the port-80 block below, `nginx -t && systemctl reload nginx`
#   3. `certbot --nginx -d mcp.e3d.ai` (adds the ssl_* lines + the 443 listen)
#   4. paste the `location` blocks into the resulting 443 server block
#
# Proxy settings mirror the existing `location = /mcp` blocks (streaming-safe:
# buffering off, HTTP/1.1). Only /mcp and /health are routed; everything else
# on this host 404s.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.e3d.ai;
    return 404;
}

# --- 443 block (certbot fills in listen 443 ssl + ssl_certificate lines) ---
server {
    server_name mcp.e3d.ai;

    client_max_body_size 256k;   # MCP JSON-RPC requests are tiny

    location = /mcp {
        proxy_pass http://127.0.0.1:3011/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (not $proxy_add_x_forwarded_for): the app trusts exactly
        # one hop and uses this for per-IP rate limiting, so a client-supplied
        # X-Forwarded-For must not be appended to / trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Authorization is passed through by default; it carries the caller's E3D API key.
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # app caps a tool call at 25s
        proxy_cache_bypass 1;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3011/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
